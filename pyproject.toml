[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptlab"
version = "0.2.0"
description = "A tested prompt-engineering library and template engine on free NVIDIA NIM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alejandro Brito" }]
keywords = ["prompt-engineering", "llm", "nvidia-nim", "template-engine", "prompts"]
dependencies = [
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.0"]

[project.scripts]
promptlab = "promptlab.cli:main"

[project.urls]
Homepage = "https://github.com/AleBrito124356/prompt-engineering-lab"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

# Ship the prompt library inside the package so a normal (non-editable)
# install works: promptlab/library/<name>/{meta.yaml,vN.md} + _partials/.
[tool.setuptools.package-data]
promptlab = ["library/*/*.md", "library/*/*.yaml", "library/_partials/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
